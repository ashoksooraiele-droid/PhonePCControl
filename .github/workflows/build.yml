      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc_server/requirements.txt

      - name: Generate Icon and Build EXE
        working-directory: pc_server
        run: |
          python make_icon.py
          pyinstaller --onefile --windowed --icon=app_icon.ico --name="PCRemoteServer" --collect-all vgamepad --collect-all sounddevice --noconfirm main.py
