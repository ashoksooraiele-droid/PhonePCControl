name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pynput sounddevice numpy pillow pyinstaller

      - name: Generate Icon and Build EXE
        run: |
          $mainFile = Get-ChildItem -Recurse -Filter "main.py" | Select-Object -First 1
          if (-not $mainFile) { throw "main.py file not found!" }
          Set-Location $mainFile.DirectoryName
          if (Test-Path "make_icon.py") { python make_icon.py }
          if (Test-Path "app_icon.ico") {
            pyinstaller --onefile --windowed --icon=app_icon.ico --name="PCRemoteServer" --collect-all sounddevice --noconfirm main.py
          } else {
            pyinstaller --onefile --windowed --name="PCRemoteServer" --collect-all sounddevice --noconfirm main.py
          }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\output"
          Copy-Item "dist\PCRemoteServer.exe" "$env:GITHUB_WORKSPACE\output\PCRemoteServer.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PCRemoteServer-Windows
          path: output/PCRemoteServer.exe
