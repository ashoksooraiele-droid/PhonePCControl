name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pynput sounddevice numpy pillow pyinstaller

      - name: Generate Icon and Build EXE
        working-directory: pc_server
        run: |
          python make_icon.py
          pyinstaller --onefile --windowed --icon=app_icon.ico --name="PCRemoteServer" --collect-all sounddevice --noconfirm main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PCRemoteServer-Windows
          path: pc_server/dist/PCRemoteServer.exe
